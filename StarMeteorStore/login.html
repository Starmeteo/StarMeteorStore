<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="icon" type="png" size="32x32" href="./images/logo-one.png">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/iconfont/iconfont.css">
</head>
<body>
    <!--导航栏开始-->
    <div class="top-nav">
        <div class="wrap">
            <ul class="top-nav-left">
                <li>
                    <a href="index.html">首页</a>
                    <span>|</span>
                </li>
                <li>
                    <a href="productlist.html">商品列表</a>
                    <span>|</span>
                    <div class="product-list">
                        <a href="#">手机</a>
                        <a href="#">电脑</a>
                        <a href="#">配件</a>
                    </div>
                    <div class="stri"></div>
                </li>
                <li>
                    <a href="#">关于StarMeteorStore</a>
                </li>
            </ul>
            <ul class="top-nav-right">
                <li><a href="login.html">登录</a><span>|</span></li>
                <li><a href="register.html">注册</a><span>|</span></li>
                <li><a href="#">消息通知</a><span>|</span></li>
                <li><a href="#">我的订单</a><span>|</span></li>
                <li class="cart">
                    <a href="#">
                        <i class="iconfont">&#xe6f2;</i>
                        <i>购物车(0)</i>
                    </a>
                    <div class="cart-list">
                        购物车中还没有商品，赶紧选购吧
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <!--导航栏结束-->
    <!--搜索栏开始-->
    <div class="search-bar">
        <div class="wrap">
            <div class="logo">
                <img src="./images/logo-one.png" alt="logo" class="store-logo">
                <img src="./images/logo-two.png" alt="logo" class="home-logo">
            </div>
            <div class="search">
                <input type="text" placeholder="搜索你想要的商品">
                <button class="iconfont">&#xe710;</button>
            </div>
        </div>
    </div>
    <!--搜索栏结束-->
    <!--登录界面开始-->
    <div class="content">
        <div class="wrap">
            <div class="login">
                <h3 class="title">用户登录</h3>
                <div class="login-box">
                    <div class="username">
                        <span class="iconfont login-img">&#xe6f3;</span>
                        <input type="text" placeholder="用户名">
                    </div>
                    <div class="password">
                        <span class="iconfont">&#xe76e;</span>
                        <input type="password" placeholder="密码">
                    </div>
                    <a href="index.html">
                        <div class="login-buton">登录</div>
                    </a>
                    <div class="other">
                        <a href="forgotpassword.html">忘记密码</a>
                        <i>|</i>
                        <a href="register.html">用户注册</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!--登陆界面结束-->
    <!--页脚开始-->
    <div class="footer">
        <div class="wrap">
            <div class="footer-head">
                <p>中南大学</p><span>|</span>
                <p>图书馆</p><span>|</span>
                <p>星韵宇商城</p>
            </div>
            <div class="footer-root">
                <p class="text-root">Copyright © 2025-now </p>
                <a href="https://github.com/Starmeteo">@Starmeteo</a> 
                <p> , All Rights Reserved.</p>
            </div>
        </div>
    </div>
    <!--页脚结束-->
</body>
</html>
